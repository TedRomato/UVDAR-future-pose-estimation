# ======================================================================
# Main scenarios sweep — full experiment matrix.
#
# Run everything:
#   python sweep.py --sweep-config configs/sweeps/main_scenarios.yaml \
#                   --run-dir ../data/sim --prefix main \
#                   --target-dir main_scenarios
#
# Or one group at a time:
#   python sweep.py ... --group scenarios
#   python sweep.py ... --group encoding
#   python sweep.py ... --group led-visibility
#
# With `uvdar.enabled: true` the exact-timestamp join keeps only rows
# where UVDAR is available, so fusion/uvdar models are automatically
# trained on the UVDAR-available subset.
# ======================================================================

bases:

  # Blinkers-only, direct prediction.
  blinkers:
    features:
      blinkers: { enabled: true,  max_leds: 4, min_leds: 2, encoding: absolute }
      uvdar:    { enabled: false, components: [position] }
      derived:  []
    epochs: 125
    val_split: 0.3
    val_padding: 0
    split_mode: sequential
    weight_decay: 1.0e-4
    activation: relu
    optimizer: adamw
    seed: 42
    learning_rate: 3.0e-4
    layers: [64, 64]
    batch_size: 256
    residual_learning: false

  # UVDAR-only (smaller net, 3-D input).
  uvdar:
    features:
      blinkers: { enabled: false, max_leds: 4, min_leds: 2, encoding: absolute }
      uvdar:    { enabled: true,  components: [position] }
      derived:  []
    epochs: 125
    val_split: 0.3
    val_padding: 0
    split_mode: sequential
    weight_decay: 1.0e-4
    activation: relu
    optimizer: adamw
    seed: 42
    learning_rate: 3.0e-4
    layers: [32, 32]
    batch_size: 256
    residual_learning: false

  # Fusion (blinkers + UVDAR), residual by default.
  fusion:
    features:
      blinkers: { enabled: true,  max_leds: 4, min_leds: 2, encoding: absolute }
      uvdar:    { enabled: true,  components: [position] }
      derived:  []
    epochs: 125
    val_split: 0.3
    val_padding: 0
    split_mode: sequential
    weight_decay: 1.0e-4
    activation: relu
    optimizer: adamw
    seed: 42
    learning_rate: 3.0e-4
    layers: [64, 64]
    batch_size: 256
    residual_learning: true


sweeps:

  # (1)-(5) Main scenarios. Fusion entries cover both LED encodings.
  scenarios:
    - { name: blinkers-direct,           base: blinkers }
    - { name: uvdar-direct,              base: uvdar,   residual_learning: false }
    - { name: uvdar-residual,            base: uvdar,   residual_learning: true  }
    - { name: fusion-absolute-direct,    base: fusion,  residual_learning: false, features: { blinkers: { encoding: absolute } } }
    - { name: fusion-absolute-residual,  base: fusion,  residual_learning: true,  features: { blinkers: { encoding: absolute } } }
    - { name: fusion-centroid-direct,    base: fusion,  residual_learning: false, features: { blinkers: { encoding: centroid } } }
    - { name: fusion-centroid-residual,  base: fusion,  residual_learning: true,  features: { blinkers: { encoding: centroid } } }

  # (6)-(7) LED coordinate encoding (blinkers-only ablation).
  encoding:
    - { name: blinkers-absolute, base: blinkers, features: { blinkers: { encoding: absolute } } }
    - { name: blinkers-centroid, base: blinkers, features: { blinkers: { encoding: centroid } } }

  # (10)-(11) Training-time LED visibility filter.
  # "flex-2to4" keeps rows with 2-4 visible LEDs (empty slots zero-filled).
  # "strict-4"  keeps only rows with exactly 4 LEDs visible.
  #
  # (12) For per-N-LEDs evaluation, re-run reconstruct/visualize on the
  # trained `*-flex-2to4` model with config overrides
  # min_leds=max_leds=2, 3, then 4 — no retraining needed.
  led-visibility:
    - { name: blinkers-flex-2to4, base: blinkers, features: { blinkers: { min_leds: 2, max_leds: 4 } } }
    - { name: blinkers-strict-4,  base: blinkers, features: { blinkers: { min_leds: 4, max_leds: 4 } } }
    - { name: fusion-flex-2to4,   base: fusion, residual_learning: true, features: { blinkers: { min_leds: 2, max_leds: 4 } } }
    - { name: fusion-strict-4,    base: fusion, residual_learning: true, features: { blinkers: { min_leds: 4, max_leds: 4 } } }